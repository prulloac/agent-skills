name: Feature Request
description: Suggest a new feature or enhancement idea
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Help us understand what you'd like to see.
  
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues for similar features
          required: true
        - label: This is a new feature, not an enhancement to existing ones
          required: true
  
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: Is this related to a frustration you're experiencing? Describe the problem.
    validations:
      required: true
  
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: Describe how you'd like the feature to work and what it should do.
    validations:
      required: true
  
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Are there any alternative approaches?
      placeholder: Describe any alternative solutions or features you've considered.
  
  - type: textarea
    id: use_cases
    attributes:
      label: Use Cases
      description: What are the main use cases for this feature?
      placeholder: |
        - Use case 1
        - Use case 2
        - Use case 3
    validations:
      required: true
  
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical (blocker)
        - High (important)
        - Medium (nice to have)
        - Low (ideas for future)
    validations:
      required: true
  
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information, mockups, or resources?
      placeholder: Add screenshots, links, or other context here
