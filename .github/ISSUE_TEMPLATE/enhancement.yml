name: Enhancement
description: Suggest an improvement to existing functionality
title: "[Enhancement]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an enhancement! Help us understand how we can improve existing features.
  
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues for similar enhancements
          required: true
        - label: This improves existing functionality, not a brand new feature
          required: true
  
  - type: input
    id: component
    attributes:
      label: Component/Feature to Enhance
      description: What component or feature should be improved?
      placeholder: e.g., Authentication, API, UI Component
    validations:
      required: true
  
  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: How does the current functionality work?
      placeholder: Describe how the feature currently works.
    validations:
      required: true
  
  - type: textarea
    id: improvement
    attributes:
      label: Proposed Improvement
      description: How can we make this better?
      placeholder: Describe the improvement and how it would benefit users.
    validations:
      required: true
  
  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: What are the benefits of this enhancement?
      placeholder: |
        - Benefit 1
        - Benefit 2
        - Benefit 3
    validations:
      required: true
  
  - type: textarea
    id: impact
    attributes:
      label: Potential Impact
      description: Could this change affect existing functionality or performance?
      placeholder: Describe any potential impacts or breaking changes.
  
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this enhancement?
      options:
        - Critical (breaks current workflow)
        - High (significantly improves workflow)
        - Medium (moderately improves workflow)
        - Low (minor improvement)
    validations:
      required: true
  
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information or examples?
      placeholder: Add screenshots, code samples, or other context here
